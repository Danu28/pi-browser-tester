name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm run check
      - name: enforce no new dependencies (only playwright expected)
        run: npm ls --depth=0
  scenario:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npx playwright install chromium
      - run: npm run scenario -- browser-tester/scenarios/dummy-form.json
        # payment page also recorded — add when stable in CI (network-flaky external site may need retry)
        # - run: npm run scenario -- browser-tester/scenarios/payment-page.json
